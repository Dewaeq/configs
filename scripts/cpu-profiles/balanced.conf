# balanced: snappy desktop use, on battery and on AC
[charger]
platform_profile = balanced
governor = powersave
energy_performance_preference = balance_performance
energy_perf_bias = balance_performance
turbo = always

[battery]
platform_profile = balanced
governor = powersave
energy_performance_preference = balance_performance
energy_perf_bias = balance_performance
turbo = always
